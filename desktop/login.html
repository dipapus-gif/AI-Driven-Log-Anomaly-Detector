<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data:">
<title>Sign in</title>
<style>
  :root {
    --black: #05030d; --ink: #f1edff; --muted: #a8a2c8;
    --purple: #7c3aed; --lavender: #b79cff; --pink: #ec4899; --cyan: #22d3ee; --gold: #fbbf24; --red: #f4766b;
    --line: rgba(167, 139, 250, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--black); color: var(--ink); overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  main { position: relative; min-height: 100%; display: grid; place-items: center; padding: 24px; overflow-y: auto; }

  .card {
    width: 100%; max-width: 410px; padding: 30px 30px 24px; border-radius: 18px;
    background: rgba(13, 8, 30, 0.74); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 24px 90px rgba(124, 58, 237, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  .mark { width: 46px; height: 46px; margin-bottom: 14px; }
  .eyebrow { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cyan); }
  h1 {
    margin: 0 0 4px; font-size: 25px; line-height: 1.2; letter-spacing: -0.01em;
    background: linear-gradient(90deg, #ffffff, var(--lavender) 70%, #f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0 0 8px; color: var(--muted); }

  label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    background: rgba(5, 3, 14, 0.72); border: 1px solid var(--line); border-radius: 9px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #6f6a92; }
  input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.22); }
  .pw { position: relative; }
  .pw input { padding-right: 62px; }
  .pw button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 5px 9px; font-size: 12.5px;
    color: var(--lavender); background: transparent; border: 0; border-radius: 6px; cursor: pointer;
  }
  .pw button:hover { background: rgba(167, 139, 250, 0.14); }

  .go {
    width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 700; letter-spacing: 0.01em; color: #fff; cursor: pointer;
    border: 0; border-radius: 10px; background: linear-gradient(135deg, #6d28d9, #a21caf 58%, var(--pink));
    box-shadow: 0 8px 28px rgba(168, 85, 247, 0.38); transition: filter .15s, transform .05s;
  }
  .go:hover:not(:disabled) { filter: brightness(1.1); }
  .go:active:not(:disabled) { transform: translateY(1px); }
  .go:disabled { opacity: .65; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  #err { min-height: 22px; margin-top: 12px; font-size: 13.5px; color: var(--red); }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-top: 10px; padding-top: 14px; border-top: 1px solid rgba(167, 139, 250, 0.14); font-size: 13px; color: var(--muted); }
  .link { padding: 0; font: inherit; color: var(--lavender); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: #fff; }
  .server b { color: var(--ink); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <form class="card" id="f" novalidate>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      </defs>
      <circle cx="24" cy="24" r="22" fill="rgba(124,58,237,0.16)" stroke="url(#g1)" stroke-width="1.6"/>
      <path d="M24 9c5 4 8 10 8 17l-4 3h-8l-4-3c0-7 3-13 8-17z" fill="#faf5ff"/>
      <circle cx="24" cy="21" r="3.2" fill="#22d3ee" stroke="#1e1b4b" stroke-width="1"/>
      <path d="M16 27l-5 7 7-2zM32 27l5 7-7-2z" fill="#8b5cf6"/>
      <path d="M21 31h6l-3 8z" fill="#fbbf24"/>
    </svg>
    <p class="eyebrow">Mission control</p>
    <h1>Log Anomaly Detector</h1>
    <p class="sub">Sign in to start your watch.</p>

    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false">

    <label for="p">Password</label>
    <div class="pw">
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button type="button" id="eye" aria-label="Show password" aria-pressed="false">Show</button>
    </div>

    <div id="srv-box" hidden>
      <label for="s">Server address</label>
      <input id="s" placeholder="https://your-app.vercel.app" autocomplete="off" spellcheck="false">
    </div>

    <button class="go" id="go" type="submit">Sign in</button>
    <div id="err" role="alert" aria-live="polite"></div>

    <div class="foot">
      <span class="server">Server: <b id="srv-label">not set</b> <button type="button" class="link" id="srv-edit">Change</button></span>
      <button type="button" class="link" id="site">Create an account or reset password</button>
    </div>
  </form>
</main>

<script src="space.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $("f"), user = $("u"), pass = $("p"), go = $("go"), err = $("err");
  var srv = $("s"), srvBox = $("srv-box"), srvLabel = $("srv-label"), srvEdit = $("srv-edit");
  var query = new URLSearchParams(location.search);
  var config = { server: "", username: "" };

  window.SpaceBackdrop.mount($("sky"), { mode: "hero" });

  function hostOf(address) { try { return new URL(address).host; } catch (e) { return ""; } }
  function setError(message) { err.textContent = message || ""; }
  function setBusy(busy, label) { go.disabled = busy; go.textContent = label || "Sign in"; }
  function serverOpen(open) {
    srvBox.hidden = !open;
    srvEdit.textContent = open ? "Done" : "Change";
    if (open) srv.focus();
  }

  window.desktop.getConfig().then(function (c) {
    config = c;
    user.value = c.username || "";
    srv.value = c.server || "";
    srvLabel.textContent = hostOf(c.server) || "not set";
    if (!c.server || query.get("server") === "1") serverOpen(true);
    else (user.value ? pass : user).focus();
    if (query.get("failed") === "1") setError("Could not reach " + (hostOf(c.server) || "the server") + ". Check the address and your connection.");
  });

  srvEdit.addEventListener("click", function () {
    if (srvBox.hidden) { serverOpen(true); return; }
    serverOpen(false);
    srvLabel.textContent = hostOf(srv.value) || hostOf(config.server) || "not set";
  });

  $("eye").addEventListener("click", function () {
    var show = pass.type === "password";
    pass.type = show ? "text" : "password";
    this.textContent = show ? "Hide" : "Show";
    this.setAttribute("aria-label", show ? "Hide password" : "Show password");
    this.setAttribute("aria-pressed", String(show));
  });

  $("site").addEventListener("click", function () {
    setError("");
    window.desktop.openSite(srv.value || config.server).then(function (r) { if (r && r.error) { setError(r.error); serverOpen(true); } });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    setError("");
    if (!srv.value.trim()) { serverOpen(true); setError("Enter your server address first."); return; }
    if (!user.value.trim() || !pass.value) { setError("Enter your username and password."); (user.value.trim() ? pass : user).focus(); return; }
    setBusy(true, "Signing in…");
    window.desktop.login({ server: srv.value, username: user.value, password: pass.value }).then(function (r) {
      if (r && r.ok) { setBusy(true, "Opening dashboard…"); return; }   // the window navigates away
      var message = (r && r.error) || "Could not sign in.";
      setError(message);
      if (/server|address|https|Vercel|reach|host/i.test(message)) serverOpen(true);   // likely an address problem
      pass.value = ""; pass.focus();
      setBusy(false);
    }, function () { setError("Something went wrong. Try again."); setBusy(false); });
  });
})();
</script>
</body>
</html>
