<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Connect</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0820; color: #ece9fb; font: 15px/1.5 system-ui, sans-serif; }
  .box { width: 100%; max-width: 420px; padding: 28px; background: #141228; border: 1px solid #2a2549; border-radius: 10px; }
  h1 { font-size: 20px; margin: 0 0 6px; } p { color: #9c98b8; margin: 0 0 16px; }
  input { width: 100%; padding: 10px; font: inherit; color: inherit; background: #100f21; border: 1px solid #2a2549; border-radius: 6px; }
  button { margin-top: 14px; width: 100%; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(135deg,#3b6df0,#8b4fe8); border: 0; border-radius: 6px; cursor: pointer; }
  #err { color: #f4766b; min-height: 22px; margin-top: 10px; font-size: 14px; }
</style></head>
<body><form class="box" id="f">
  <h1>Connect to your server</h1>
  <p>Enter the address where your Log Anomaly Detector is deployed.</p>
  <label for="s" hidden>Server address</label>
  <input id="s" placeholder="https://your-app.vercel.app" autocomplete="off" spellcheck="false" autofocus>
  <button type="submit">Connect</button>
  <div id="err" role="alert"></div>
</form>
<script>
  const err = document.getElementById("err");
  if (location.search.includes("failed=1")) err.textContent = "Could not reach the saved server. Check the address and your connection.";
  window.desktop.getServer().then((s) => { if (s) document.getElementById("s").value = s; });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await window.desktop.setServer(document.getElementById("s").value);
    if (r.error) err.textContent = r.error;
  });
</script></body></html>
